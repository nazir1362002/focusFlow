<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Focus Blueprint – FocusFlow</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .blueprint-wrapper {
      max-width: 650px;
      margin: 0 auto;
    }
    .blueprint-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .blueprint-header h1 {
      color: #38bdf8;
      font-size: 1.9rem;
      margin-bottom: 0.4rem;
    }
    .blueprint-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 2rem 2.2rem;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .blueprint-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #38bdf8, #0ea5e9);
      border-radius: 16px 16px 0 0;
    }
    .blueprint-title {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 1.75rem;
      letter-spacing: 0.5px;
    }
    .section {
      margin-bottom: 1.4rem;
    }
    .section-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      margin-bottom: 0.3rem;
    }
    .section-value {
      font-size: 1.1rem;
      color: #e2e8f0;
      line-height: 1.5;
    }
    .score-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: #38bdf8;
    }
    .actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 2.5rem;
      justify-content: center;
    }
    .btn-outline {
      background: transparent;
      border: 2px solid #38bdf8;
      color: #38bdf8;
      width: auto;
      padding: 0.7rem 1.5rem;
    }
    .btn-outline:hover {
      background: #38bdf8;
      color: #0f172a;
    }
    .loading {
      text-align: center;
      padding: 3rem;
      color: #94a3b8;
    }
    .raw-content {
      white-space: pre-wrap;
      line-height: 1.6;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="container" style="padding-top: 2.5rem; padding-bottom: 3rem;">
    <div class="blueprint-wrapper">
      
      <div class="blueprint-header">
        <a href="/dashboard.html" style="color:#94a3b8; font-size:0.9rem;">← Back to Dashboard</a>
        <h1>Personal Focus Blueprint</h1>
        <p style="color:#94a3b8;">Your personalized focus plan</p>
      </div>

      <div id="loading" class="loading">Loading your blueprint...</div>
      <div id="error" class="error-message"></div>

      <div id="blueprintCard" class="blueprint-card" style="display:none;">
        <div class="blueprint-title">MY PERSONAL FOCUS BLUEPRINT</div>
        <div id="blueprintContent" class="raw-content"></div>
      </div>

      <div class="actions" id="actions" style="display:none;">
        <a href="/report.html" class="btn btn-outline">View Weekly Report</a>
        <a href="/dashboard.html" class="btn" style="width:auto; padding:0.7rem 1.5rem;">Back to Dashboard</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    requireAuth();

    async function loadBlueprint() {
      try {
        const report = await apiRequest('/api/report');

        document.getElementById('loading').style.display = 'none';
        document.getElementById('blueprintCard').style.display = 'block';
        document.getElementById('actions').style.display = 'flex';

        let content = report.focusBlueprint || 'No blueprint content available.';

        // Simple formatting
        content = content
          .replace(/^MY MAIN GOAL/gim, '<div class="section"><div class="section-label">MY MAIN GOAL</div><div class="section-value">')
          .replace(/^WHY IT MATTERS/gim, '</div></div><div class="section"><div class="section-label">WHY IT MATTERS</div><div class="section-value">')
          .replace(/^MY STRENGTHS/gim, '</div></div><div class="section"><div class="section-label">MY STRENGTHS</div><div class="section-value">')
          .replace(/^HIGH-IMPACT ACTIVITIES/gim, '</div></div><div class="section"><div class="section-label">HIGH-IMPACT ACTIVITIES</div><div class="section-value">')
          .replace(/^DISTRACTIONS TO REDUCE/gim, '</div></div><div class="section"><div class="section-label">DISTRACTIONS TO REDUCE</div><div class="section-value">')
          .replace(/^FOCUS SCORE/gim, '</div></div><div class="section"><div class="section-label">FOCUS SCORE</div><div class="section-value score-value">')
          .replace(/^NEXT ACTION/gim, '</div></div><div class="section"><div class="section-label">NEXT ACTION</div><div class="section-value">')
          + '</div></div>';

        document.getElementById('blueprintContent').innerHTML = content;
      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').textContent = err.message || 'Blueprint not found. Please generate it from the Dashboard first.';
        document.getElementById('error').style.display = 'block';
      }
    }

    loadBlueprint();
  </script>
</body>
</html>
