<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – FocusFlow</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a class="brand auth-brand" href="/index.html" aria-label="FocusFlow home">
        <img src="images/logo-mark.jpg" alt="" width="40" height="40" />
      </a>
      <h1>FocusFlow</h1>
      <p class="subtitle">Welcome back. Continue your focus journey.</p>

      <div id="error" class="error-message"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" required />
        </div>

        <button type="submit" class="btn" id="submitBtn">Login</button>
      </form>

      <p class="auth-footer">
        Don't have an account? <a href="/register.html">Register</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Redirect if already logged in
    redirectIfLoggedIn();

    const form = document.getElementById('loginForm');
    const errorDiv = document.getElementById('error');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      errorDiv.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const data = await loginUser(email, password);

        saveToken(data.token);
        saveUser({
          _id: data._id,
          name: data.name,
          email: data.email,
          currentCycle: data.currentCycle,
        });

        window.location.href = '/dashboard.html';
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
