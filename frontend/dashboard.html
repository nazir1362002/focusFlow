<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – FocusFlow</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .day-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .day-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 1.25rem 1rem;
      text-align: center;
      border: 2px solid transparent;
      transition: all 0.2s;
      cursor: pointer;
    }
    .day-card.locked {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .day-card.completed {
      border-color: #22c55e;
    }
    .day-card.current {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .day-card:hover:not(.locked) {
      transform: translateY(-3px);
    }
    .day-number {
      font-size: 1.5rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 0.35rem;
    }
    .day-title {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .status-badge {
      display: inline-block;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }
    .status-completed { background: #14532d; color: #86efac; }
    .status-current { background: #0c4a6e; color: #7dd3fc; }
    .status-locked { background: #334155; color: #94a3b8; }
    .score-box {
      background: #1e293b;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      margin-bottom: 2rem;
    }
    .score-value {
      font-size: 3rem;
      font-weight: 700;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 900px; padding-top: 2rem; padding-bottom: 3rem;">
    
    <div class="dashboard-header">
      <div>
        <h1 style="color:#38bdf8; font-size:1.8rem;">FocusFlow</h1>
        <p id="greeting" style="color:#94a3b8;"></p>
      </div>
      <button class="btn" style="width:auto; padding:0.6rem 1.2rem;" onclick="logout()">Logout</button>
    </div>

    <!-- Focus Score (placeholder for now) -->
    <div class="score-box">
      <div style="color:#94a3b8; margin-bottom:0.3rem;">Your Focus Score</div>
      <div class="score-value" id="focusScore">—</div>
      <div style="color:#64748b; font-size:0.9rem;">Complete all 7 days to unlock your score</div>
    </div>

    <!-- Days Grid -->
    <h2 style="margin-bottom:1rem; font-size:1.2rem;">Your 7-Day Journey</h2>
    <div class="day-grid" id="dayGrid">
      <!-- Cards will be generated by JS -->
    </div>

    <div style="background:#1e293b; border-radius:12px; padding:1.25rem; color:#94a3b8; font-size:0.95rem;">
      <strong style="color:#e2e8f0;">How it works:</strong>  
      Complete each day in order. You cannot skip days. After Day 7 you will receive your personalized Weekly Report and Focus Blueprint.
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    requireAuth();

    const user = getUser();
    document.getElementById('greeting').textContent = `Hello, ${user?.name || 'User'}!`;

    const dayTitles = {
      1: 'Self Discovery',
      2: 'Goal Clarity',
      3: 'Action Planning',
      4: '80/20 Analysis',
      5: 'Distraction Control',
      6: 'Information Diet',
      7: 'Final Review'
    };

    async function loadDashboard() {
      try {
        const progress = await apiRequest('/api/progress');

        // Show score if available
        if (progress.focusScore !== null && progress.focusScore !== undefined) {
          document.getElementById('focusScore').textContent = progress.focusScore;
        }

        const grid = document.getElementById('dayGrid');
        grid.innerHTML = '';

        for (let day = 1; day <= 7; day++) {
          const isCompleted = progress.completedDays.includes(day);
          const isCurrent = progress.currentDay === day && !progress.isCompleted;
          const isLocked = day > progress.currentDay;

          let statusClass = 'locked';
          let statusText = 'Locked';
          let statusBadge = 'status-locked';

          if (isCompleted) {
            statusClass = 'completed';
            statusText = 'Completed';
            statusBadge = 'status-completed';
          } else if (isCurrent) {
            statusClass = 'current';
            statusText = 'Current';
            statusBadge = 'status-current';
          }

          const card = document.createElement('div');
          card.className = `day-card ${statusClass}`;
          card.innerHTML = `
            <div class="day-number">Day ${day}</div>
            <div class="day-title">${dayTitles[day]}</div>
            <div class="status-badge ${statusBadge}">${statusText}</div>
          `;

          if (!isLocked) {
            card.onclick = () => {
              window.location.href = `/day${day}.html`;
            };
          }

          grid.appendChild(card);
        }
      } catch (err) {
        console.error(err);
        alert('Failed to load progress. Please refresh.');
      }
    }

    function logout() {
      removeToken();
      window.location.href = '/login.html';
    }

    loadDashboard();
  </script>
</body>
</html>
