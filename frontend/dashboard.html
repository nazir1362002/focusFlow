<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – FocusFlow</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .day-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .day-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 1.25rem 1rem;
      text-align: center;
      border: 2px solid transparent;
      transition: all 0.2s;
      cursor: pointer;
    }
    .day-card.locked { opacity: 0.45; cursor: not-allowed; }
    .day-card.completed { border-color: #22c55e; }
    .day-card.current {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .day-card:hover:not(.locked) { transform: translateY(-3px); }
    .day-number {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f766e;
      margin-bottom: 0.35rem;
    }
    .day-title { font-size: 0.85rem; color: #64748b; }
    .status-badge {
      display: inline-block;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }
    .status-completed { background: #dcfce7; color: #166534; }
    .status-current { background: #ccfbf1; color: #0f766e; }
    .status-locked { background: #e2e8f0; color: #64748b; }

    .score-box {
      background: #ffffff;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      margin-bottom: 2rem;
    }
    .score-value {
      font-size: 3rem;
      font-weight: 700;
      color: #0f766e;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-bottom: 2rem;
    }
    @media (max-width: 700px) {
      .charts-grid { grid-template-columns: 1fr; }
    }
    .chart-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 1.25rem;
    }
    .chart-card h3 {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 1rem;
      text-align: center;
    }
    .chart-container {
      position: relative;
      height: 220px;
    }

    .quick-links {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 1.5rem;
    }
    .btn-outline {
      background: transparent;
      border: 2px solid #0f766e;
      color: #0f766e;
      width: auto;
      padding: 0.55rem 1.2rem;
      font-size: 0.9rem;
    }
    .btn-outline:hover {
      background: #0f766e;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 950px; padding-top: 2rem; padding-bottom: 3rem;">
    
    <div class="dashboard-header">
      <div>
        <h1 style="color:#0f766e; font-size:1.8rem;">FocusFlow</h1>
        <p id="greeting" style="color:#64748b;"></p>
      </div>
      <button class="btn" style="width:auto; padding:0.6rem 1.2rem;" onclick="logout()">Logout</button>
    </div>

    <!-- Focus Score -->
    <div class="score-box">
      <div style="color:#64748b; margin-bottom:0.3rem;">Your Focus Score</div>
      <div class="score-value" id="focusScore">—</div>
      <div id="scoreMessage" style="color:#64748b; font-size:0.9rem;">Complete all 7 days to unlock your score</div>
      
      <div id="reportActions" style="margin-top:1.25rem; display:none;">
        <button class="btn" style="width:auto; padding:0.55rem 1.2rem; margin:0.25rem;" onclick="generateReport()">
          Generate AI Report
        </button>
        <a href="/report.html" class="btn btn-outline" style="display:inline-block; margin:0.25rem;">View Report</a>
        <a href="/blueprint.html" class="btn btn-outline" style="display:inline-block; margin:0.25rem;">View Blueprint</a>
      </div>
    </div>

    <!-- Days Grid -->
    <h2 style="margin-bottom:1rem; font-size:1.15rem;">Your 7-Day Journey</h2>
    <div class="day-grid" id="dayGrid"></div>

    <!-- Charts -->
    <h2 style="margin: 2rem 0 1rem; font-size:1.15rem;">Analytics</h2>
    <div class="charts-grid">
      <div class="chart-card">
        <h3>Task Impact Distribution</h3>
        <div class="chart-container">
          <canvas id="impactChart"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <h3>Information Diet</h3>
        <div class="chart-container">
          <canvas id="infoChart"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <h3>Focus Sessions</h3>
        <div class="chart-container">
          <canvas id="focusChart"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <h3>Score Breakdown</h3>
        <div class="chart-container">
          <canvas id="scoreChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Quick Links -->
    <div class="quick-links">
      <a href="/sayno.html" class="btn btn-outline">Say No Simulator</a>
      <a href="/day1.html" class="btn btn-outline">Go to Current Day</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    requireAuth();

    const user = getUser();
    document.getElementById('greeting').textContent = `Hello, ${user?.name || 'User'}!`;

    const dayTitles = {
      1: 'Self Discovery',
      2: 'Goal Clarity',
      3: 'Action Planning',
      4: '80/20 Analysis',
      5: 'Distraction Control',
      6: 'Information Diet',
      7: 'Final Review'
    };

    let impactChart, infoChart, focusChart, scoreChart;

    async function loadDashboard() {
      try {
        const progress = await apiRequest('/api/progress');

        // Score
        if (progress.focusScore !== null && progress.focusScore !== undefined) {
          document.getElementById('focusScore').textContent = progress.focusScore;
          document.getElementById('scoreMessage').textContent = 'Based on your 7-day data';
          document.getElementById('reportActions').style.display = 'block';
        } else if (progress.isCompleted) {
          document.getElementById('scoreMessage').textContent = 'Journey completed! Generate your score & report.';
          document.getElementById('reportActions').style.display = 'block';
        }

        // Day cards
        const grid = document.getElementById('dayGrid');
        grid.innerHTML = '';

        for (let day = 1; day <= 7; day++) {
          const isCompleted = progress.completedDays.includes(day);
          const isCurrent = progress.currentDay === day && !progress.isCompleted;
          const isLocked = day > progress.currentDay && !progress.isCompleted;

          let statusClass = 'locked';
          let statusText = 'Locked';
          let statusBadge = 'status-locked';

          if (isCompleted) {
            statusClass = 'completed';
            statusText = 'Completed';
            statusBadge = 'status-completed';
          } else if (isCurrent) {
            statusClass = 'current';
            statusText = 'Current';
            statusBadge = 'status-current';
          }

          const card = document.createElement('div');
          card.className = `day-card ${statusClass}`;
          card.innerHTML = `
            <div class="day-number">Day ${day}</div>
            <div class="day-title">${dayTitles[day]}</div>
            <div class="status-badge ${statusBadge}">${statusText}</div>
          `;
          if (!isLocked) {
            card.onclick = () => window.location.href = `/day${day}.html`;
          }
          grid.appendChild(card);
        }

        // Load charts data
        await loadCharts(progress);
      } catch (err) {
        console.error(err);
      }
    }

    async function loadCharts(progress) {
      try {
        const [tasks, info, sessions, report] = await Promise.all([
          apiRequest('/api/tasks').catch(() => []),
          apiRequest('/api/info').catch(() => []),
          apiRequest('/api/focus').catch(() => []),
          apiRequest('/api/report').catch(() => null)
        ]);

        // 1. Task Impact Chart
        const high = tasks.filter(t => t.impact === 'High').length;
        const medium = tasks.filter(t => t.impact === 'Medium').length;
        const low = tasks.filter(t => t.impact === 'Low').length;

        if (impactChart) impactChart.destroy();
        impactChart = new Chart(document.getElementById('impactChart'), {
          type: 'doughnut',
          data: {
            labels: ['High Impact', 'Medium', 'Low Impact'],
            datasets: [{
              data: [high, medium, low],
              backgroundColor: ['#22c55e', '#eab308', '#ef4444']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { color: '#64748b' } } }
          }
        });

        // 2. Information Diet Chart
        const useful = info.filter(i => i.isUseful).length;
        const waste = info.filter(i => !i.isUseful).length;

        if (infoChart) infoChart.destroy();
        infoChart = new Chart(document.getElementById('infoChart'), {
          type: 'doughnut',
          data: {
            labels: ['Useful', 'Waste'],
            datasets: [{
              data: [useful, waste],
              backgroundColor: ['#22c55e', '#ef4444']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { color: '#64748b' } } }
          }
        });

        // 3. Focus Sessions Chart
        const sessionLabels = sessions.slice(0, 7).map((s, i) => `S${i+1}`).reverse();
        const sessionData = sessions.slice(0, 7).map(s => s.actualDuration).reverse();

        if (focusChart) focusChart.destroy();
        focusChart = new Chart(document.getElementById('focusChart'), {
          type: 'bar',
          data: {
            labels: sessionLabels.length ? sessionLabels : ['No data'],
            datasets: [{
              label: 'Minutes',
              data: sessionData.length ? sessionData : [0],
              backgroundColor: '#0f766e'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: true, ticks: { color: '#64748b' }, grid: { color: '#e2e8f0' } },
              x: { ticks: { color: '#64748b' }, grid: { color: '#e2e8f0' } }
            },
            plugins: { legend: { display: false } }
          }
        });

        // 4. Score Breakdown Chart
        const breakdown = report?.scoreBreakdown || {
          goalAlignment: 0,
          highImpactWork: 0,
          focusConsistency: 0,
          distractionManagement: 0,
          informationManagement: 0
        };

        if (scoreChart) scoreChart.destroy();
        scoreChart = new Chart(document.getElementById('scoreChart'), {
          type: 'radar',
          data: {
            labels: ['Goals', 'High Impact', 'Focus', 'Distraction', 'Info Diet'],
            datasets: [{
              label: 'Score',
              data: [
                breakdown.goalAlignment,
                breakdown.highImpactWork,
                breakdown.focusConsistency,
                breakdown.distractionManagement,
                breakdown.informationManagement
              ],
              backgroundColor: 'rgba(56, 189, 248, 0.2)',
              borderColor: '#0f766e',
              pointBackgroundColor: '#0f766e'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              r: {
                beginAtZero: true,
                max: 25,
                ticks: { display: false },
                grid: { color: '#e2e8f0' },
                pointLabels: { color: '#64748b' }
              }
            },
            plugins: { legend: { display: false } }
          }
        });

      } catch (err) {
        console.error('Charts error:', err);
      }
    }

    async function generateReport() {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = 'Generating...';

      try {
        const report = await apiRequest('/api/report/generate', { method: 'POST' });
        document.getElementById('focusScore').textContent = report.focusScore;
        document.getElementById('scoreMessage').textContent = 'Based on your 7-day data';
        alert('Report & Blueprint generated successfully!');
        loadDashboard(); // refresh charts
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.textContent = 'Generate AI Report';
        btn.disabled = false;
      }
    }

    function logout() {
      removeToken();
      window.location.href = '/login.html';
    }

    loadDashboard();
  </script>
</body>
</html>
